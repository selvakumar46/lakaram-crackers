services:
  # 1. Full-Stack Application (React Frontend + CockroachDB PostgreSQL Server)
  - type: web
    name: lakaram-crackers-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://lakaram:4sOukdWZ2e1jX7aUUeCyNg@lakaram-crackers-34301.j77.aws-ap-south-1.cockroachlabs.cloud:26257/defaultdb?sslmode=verify-full

  # 2. Java Spring Boot Backend Service (Optional API)
  - type: web
    name: lakaram-crackers-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/crackers-store-backend-1.0.0.jar
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://lakaram-crackers-34301.j77.aws-ap-south-1.cockroachlabs.cloud:26257/defaultdb?sslmode=verify-full
      - key: SPRING_DATASOURCE_USERNAME
        value: lakaram
      - key: SPRING_DATASOURCE_PASSWORD
        value: 4sOukdWZ2e1jX7aUUeCyNg
    plan: free
