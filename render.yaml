services:
  # 1. Frontend React Application (Static Site)
  - type: web
    name: lakaram-crackers-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Java Spring Boot Backend Service (Optional API)
  - type: web
    name: lakaram-crackers-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/crackers-store-backend-1.0.0.jar
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-sweet-bonus-azmv80s3-pooler.c-3.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_SzMhVg42oPKi
    plan: free
