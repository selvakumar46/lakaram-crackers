services:
  # 1. Full-Stack Application (React Frontend + Neon PostgreSQL Server)
  - type: web
    name: lakaram-crackers-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_SzMhVg42oPKi@ep-sweet-bonus-azmv80s3-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require

  # 2. Java Spring Boot Backend Service (Optional API)
  - type: web
    name: lakaram-crackers-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/crackers-store-backend-1.0.0.jar
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-sweet-bonus-azmv80s3-pooler.c-3.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_SzMhVg42oPKi
    plan: free
