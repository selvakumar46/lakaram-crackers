services:
  # 1. Frontend React Application (Static Site)
  - type: web
    name: lakaram-crackers-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Java Spring Boot Backend Service (Optional API)
  - type: web
    name: lakaram-crackers-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/crackers-store-backend-1.0.0.jar
    envVars:
      - key: PORT
        value: 10000
    plan: free
